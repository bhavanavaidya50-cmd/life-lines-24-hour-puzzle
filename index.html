<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
    <title>Life Lines – The 24-Hour Puzzle</title>
    <meta name="description" content="An interactive strategy, mystery and life-simulation puzzle game for thoughtful adults. Every decision changes the story." />
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Crimson+Pro:ital,wght@0,400..700;1,400..700&family=Inter:wght@300;400;500;600;700&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
      * {
        box-sizing: border-box;
        margin: 0;
        padding: 0;
        user-select: none;
        -webkit-user-select: none;
        -webkit-touch-callout: none;
      }
      body, html {
        width: 100%;
        height: 100%;
        overflow: hidden;
        background-color: #080b12;
        font-family: 'Inter', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
        color: #e2e8f0;
      }
      #game-container {
        width: 100vw;
        height: 100vh;
        display: flex;
        justify-content: center;
        align-items: center;
        position: relative;
        background: radial-gradient(circle at center, #111827 0%, #060910 100%);
      }
      canvas {
        box-shadow: 0 10px 40px rgba(0, 0, 0, 0.8), 0 0 1px 1px rgba(201, 168, 76, 0.2);
        max-width: 100%;
        max-height: 100%;
      }
      #orientation-warning {
        display: none;
        position: fixed;
        top: 0; left: 0; width: 100%; height: 100%;
        background: #080b12;
        color: #f59e0b;
        z-index: 9999;
        justify-content: center;
        align-items: center;
        flex-direction: column;
        text-align: center;
        padding: 24px;
        font-family: 'Crimson Pro', serif;
      }
      @media (max-width: 600px) and (orientation: portrait) {
        #orientation-warning {
          display: flex;
        }
      }
    </style>
  </head>
  <body>
    <div id="game-container"></div>
    <div id="orientation-warning">
      <h2 style="font-size: 1.8rem; margin-bottom: 12px; color: #c9a84c;">Rotate to Landscape</h2>
      <p style="font-size: 1.1rem; color: #cbd5e1; max-width: 320px;">
        LIFE LINES is designed for optimal strategic planning in landscape mode. Please turn your device horizontally.
      </p>
    </div>
    <script type="module" src="/src/main.js"></script>
  </body>
</html>
